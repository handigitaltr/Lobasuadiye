<head>
<meta charset="UTF-8">

<title>LOBA Coffee & Bakery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #0c3d2a;
    --forest-deep: #082a1c;
    --cream: #f3ead2;
    --cream-dim: #cdbf9c;
    --gold: #c9a05f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100svh;
    background:
      radial-gradient(circle at 50% 0%, var(--forest) 0%, var(--forest-deep) 78%);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .page{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .stamp{
    position:relative;
    width:150px;
    height:150px;
    margin-bottom:28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stamp svg{
    position:absolute;
    top:0; left:0;
    width:150px;
    height:150px;
    animation: spin 34s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .stamp svg{ animation:none; }
  }
  .stamp img{
    width:96px;
    height:96px;
    border-radius:50%;
    position:relative;
    z-index:1;
    box-shadow: 0 0 0 1px rgba(243,234,210,0.18);
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:34px;
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--cream);
  }
  .tagline{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 40px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:36px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    border-radius:999px;
    border:1px solid rgba(243,234,210,0.28);
    background:rgba(243,234,210,0.04);
    color:var(--cream);
    text-decoration:none;
    font-family:'Jost', sans-serif;
    font-size:15px;
    letter-spacing:0.3px;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .link-btn:active{ transform:scale(0.98); }
  .link-btn:hover{
    background:rgba(243,234,210,0.09);
    border-color:var(--gold);
  }
  .icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
  }
  .icon svg{ width:100%; height:100%; }
  .label{
    flex:1;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .label .main{ font-size:15px; color:var(--cream); }
  .label .sub{ font-size:11.5px; color:var(--cream-dim); letter-spacing:0.4px; }
  .arrow{ color:var(--cream-dim); font-size:16px; }

  .footer{
    font-size:10.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--cream-dim);
    opacity:0.7;
  }
</style>
</head>
